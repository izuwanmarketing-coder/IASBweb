<!doctype html><html><head><meta charset="utf-8"><title>Izuwan responsive review</title><style>body{margin:0;background:#e5e5e8;font:14px Arial}header{padding:12px;display:flex;gap:12px;align-items:center}iframe{display:block;border:0;background:#fff;margin:0 auto;max-width:none}button,input{padding:8px}main{overflow:auto}</style></head><body><header><strong>Local review</strong><label>Width <input id="width" type="number" value="390"></label><label>Height <input id="height" type="number" value="844"></label><label>Page <input id="page" value="/"></label><button id="apply">Apply viewport</button></header><main><iframe title="Website preview" width="390" height="844" src="/"></iframe></main><script>document.querySelector('#apply').onclick=()=>{const f=document.querySelector('iframe');f.width=document.querySelector('#width').value;f.height=document.querySelector('#height').value;const path=document.querySelector('#page').value;if(path.startsWith('/')&&!path.startsWith('//'))f.src=path;};</script></body></html>
